[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "crossbottle"
version = "0.1.0"
description = "Free, open-source CrossOver alternative for macOS: Wine bottle manager and launcher that runs Steam and Windows games on Apple Silicon"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
crossbottle = "crossbottle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crossbottle = ["data/*.exe"]
