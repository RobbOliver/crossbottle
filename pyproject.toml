[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openbottle"
version = "0.1.0"
description = "Clean-room Wine bottle manager and launcher"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
openbottle = "openbottle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openbottle = ["data/*.exe"]
